<style>
/* Layout: one-screen drafting tool. Tool header, full-bleed canvas, command footer.
   Skins are KAD's own: Classic Dark, Classic Light, Blueprint, Parchment (Auto follows the system). */
:root{--bg:#ffffff;--g1:#f0f0f0;--g2:#e0e0e0;--ink:#111111;--ui:#f3f3f3;--bd:#cfcfcf;--mut:#666666;--hot:#000000;--sel:#d4380d;--win:#1f6fd6;--crs:#1f9d4a;
--fu:'Atkinson Hyperlegible',system-ui,sans-serif;--fm:'JetBrains Mono',ui-monospace,Menlo,monospace;--fd:Syne,system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0a0a0a;--g1:#141414;--g2:#212121;--ink:#ececec;--ui:#161616;--bd:#333333;--mut:#8c8c8c;--hot:#ffffff;--sel:#ffb02e;--win:#4d9dff;--crs:#3ddc84;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0a0a0a;--g1:#141414;--g2:#212121;--ink:#ececec;--ui:#161616;--bd:#333333;--mut:#8c8c8c;--hot:#ffffff;--sel:#ffb02e;--win:#4d9dff;--crs:#3ddc84;color-scheme:dark}
:root[data-skin=dark]{--bg:#0a0a0a;--g1:#141414;--g2:#212121;--ink:#ececec;--ui:#161616;--bd:#333333;--mut:#8c8c8c;--hot:#ffffff;--sel:#ffb02e;--win:#4d9dff;--crs:#3ddc84;color-scheme:dark}
:root[data-skin=light]{--bg:#ffffff;--g1:#f0f0f0;--g2:#e0e0e0;--ink:#111111;--ui:#f3f3f3;--bd:#cfcfcf;--mut:#666666;--hot:#000000;--sel:#d4380d;--win:#1f6fd6;--crs:#1f9d4a;color-scheme:light}
:root[data-skin=blueprint]{--bg:#123259;--g1:#17406f;--g2:#1f5188;--ink:#f0f4f8;--ui:#0e2038;--bd:#2a5483;--mut:#8eabc8;--hot:#00d4ff;--sel:#ffaa00;--win:#7ab8ff;--crs:#00ff9d;color-scheme:dark}
:root[data-skin=parchment]{--bg:#f2e8d0;--g1:#e9dcbb;--g2:#dccb9f;--ink:#2e2412;--ui:#e4d5ab;--bd:#b8a068;--mut:#63512f;--hot:#6b4423;--sel:#b3261e;--win:#1f5fa8;--crs:#2a7a3b;color-scheme:light}
*{box-sizing:inherit}
html,body{height:100%;margin:0}
body{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;background:var(--bg);color:var(--ink);font:400 14px/1.3 var(--fu);overflow:hidden}
header,footer{background:var(--ui);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:6px 10px}
header{border-bottom:1px solid var(--bd)}
footer{border-top:1px solid var(--bd);font-variant-numeric:tabular-nums}
.grp{display:flex;gap:2px}
button,label.b{font:inherit;color:inherit;background:transparent;border:1px solid var(--bd);padding:5px 10px;border-radius:2px;cursor:pointer;position:relative}
button:hover:not(:disabled),label.b:hover{background:var(--g1)}
button[aria-pressed=true]{background:var(--g1);box-shadow:inset 0 -2px var(--hot)}
button:disabled{opacity:.4;cursor:default}
kbd{font:inherit;font-family:var(--fm);font-size:11px;margin-left:6px;opacity:.6}
:focus-visible,label.b:focus-within{outline:2px solid var(--sel);outline-offset:1px}
#file{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
#wrap{position:relative;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;outline-offset:-2px}
#num,#cmd{width:10em;font:inherit;font-family:var(--fm);font-size:12.5px;background:var(--bg);color:var(--ink);border:1px solid var(--bd);border-radius:2px;padding:4px 6px}
#cmd{width:24em;max-width:100%}
#pos{min-width:13em;font-family:var(--fm);font-size:12.5px}
#read{font-family:var(--fm);font-size:12.5px;font-weight:500}
#hint{color:var(--mut);flex:1;min-width:14em}
select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--bd);border-radius:2px;padding:5px 6px;max-width:14em}
.hide{display:none!important}
label.b{display:inline-flex;align-items:center;justify-content:center}
#menu{position:fixed;z-index:10;min-width:13em;display:flex;flex-direction:column;background:var(--ui);border:1px solid var(--bd);border-radius:2px;padding:3px;box-shadow:0 6px 20px #0006}
#menu button{border-color:transparent;text-align:left;white-space:nowrap}
#menu hr{border:0;border-top:1px solid var(--bd);margin:3px 0;width:100%}
#menu .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);padding:4px 10px 2px}
#menu button[aria-checked=true]::after{content:"\2713";position:absolute;right:10px}
dialog{background:var(--ui);color:var(--ink);border:1px solid var(--bd);border-radius:2px;padding:12px}
dialog::backdrop{background:#0008}
#nmIn{font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--bd);border-radius:2px;padding:6px;width:14em;margin:6px 0 10px}
dialog .grp{gap:6px;justify-content:flex-end}
#lsw{width:12px;height:12px;border:1px solid var(--bd);display:inline-block;border-radius:1px}
.lay{display:flex;gap:6px;align-items:center}
.brand{display:flex;align-items:center;gap:8px;border-color:transparent}
.brand .mk{font-family:var(--fd);font-weight:700;font-size:17px;letter-spacing:.06em;line-height:1}
.brand .lt{font-family:var(--fm);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--hot);border:1px solid var(--hot);padding:1px 4px;border-radius:2px;line-height:1.2}
.car{font-size:10px;opacity:.6}
@media(pointer:coarse){button,label.b,select,#cmd,#num{min-height:40px}body{height:100dvh}}
@media(max-width:700px),(pointer:coarse){footer{gap:4px 10px;padding:4px 8px}#pos{min-width:0}#cmd{flex:1 1 100%;width:auto;min-width:0}#num{flex:1 1 8em;width:auto}#hint{flex:1 1 100%;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}header{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;gap:4px 10px;padding:4px 8px}header::-webkit-scrollbar{display:none}header>*{flex:0 0 auto}button,label.b,select{white-space:nowrap}kbd{display:none}}
</style>
</head>
<body>
<header>
  <button class="brand" id="bMenu" aria-haspopup="menu" aria-expanded="false" aria-label="KADlite menu"><span class="mk">KAD</span><span class="lt">lite</span><span class="car" aria-hidden="true">&#9662;</span></button>
  <div class="grp" id="tools" role="group" aria-label="Tools">
    <button data-t="select">Select<kbd>V</kbd></button>
    <button data-t="line">Line<kbd>L</kbd></button>
    <button data-t="pl">Polyline<kbd>P</kbd></button>
    <button data-t="rect">Rectangle<kbd>R</kbd></button>
    <button data-t="circ">Circle<kbd>C</kbd></button>
    <button data-t="arc">Arc<kbd>A</kbd></button>
    <button data-t="dim">Dimension<kbd>D</kbd></button>
    <button data-t="off">Offset<kbd>O</kbd></button>
    <button data-t="trim">Trim<kbd>T</kbd></button>
    <button data-t="ext">Extend<kbd>E</kbd></button>
  </div>
  <div class="grp" role="group" aria-label="Snapping">
    <button id="bGrid">Grid snap</button>
    <button id="bObj">Object snap</button>
    <button id="bOrtho">Ortho<kbd>Shift</kbd></button>
  </div>
  <div class="grp">
    <button id="bUndo">Undo</button><button id="bRedo">Redo</button><button id="bDel">Delete</button>
  </div>
  <div class="grp">
    <button id="bIn" aria-label="Zoom in">+</button><button id="bOut" aria-label="Zoom out">&minus;</button><button id="bFit">Fit<kbd>Z</kbd></button>
  </div>
  <div class="grp">
    <label class="b">Open<input id="file" type="file" accept=".kad,.dxf,.json" aria-label="Open a .kad or .dxf drawing"></label>
    <button id="bSave" class="hide">Save .kad</button>
    <button id="bDxf" class="hide">Export .dxf</button>
  </div>
  <div class="lay" role="group" aria-label="Layers"><i id="lsw"></i><select id="lay" aria-label="Current layer"></select><button id="bLayNew">New layer</button><button id="bLayVis">Hide layer</button><button id="bLayMove">Move selection here</button></div>
</header>
<div id="wrap"><canvas id="cv" tabindex="0" aria-label="Drawing area"></canvas></div>
<footer>
  <span id="pos"></span>
  <span id="read"></span>
  <input id="cmd" placeholder="Command: move 10,5 &middot; rotate 90 &middot; offset 5 &middot; text 5 Hello &middot; help   ( / )" aria-label="Command line" autocomplete="off" spellcheck="false">
  <input id="num" class="hide" aria-label="Exact size">
  <span id="hint"></span>
</footer>
<div id="menu" class="hide" role="menu">
  <button role="menuitem" data-a="new">New drawing</button>
  <button role="menuitem" data-a="open">Open .kad / .dxf</button>
  <button role="menuitem" id="mSave" data-a="save">Save .kad</button>
  <button role="menuitem" id="mDxf" data-a="dxf">Export .dxf</button>
  <hr>
  <button role="menuitem" data-a="units" id="mUn">Units: mm</button>
  <div class="lbl">Theme</div>
  <button role="menuitemradio" data-skin="auto">Auto</button>
  <button role="menuitemradio" data-skin="dark">Classic Dark</button>
  <button role="menuitemradio" data-skin="light">Classic Light</button>
  <button role="menuitemradio" data-skin="blueprint">Blueprint</button>
  <button role="menuitemradio" data-skin="parchment">Parchment</button>
</div>
<dialog id="nmDlg"><form method="dialog"><label>Drawing name<br><input id="nmIn" autocomplete="off" spellcheck="false"> .kad</label><div class="grp"><button type="button" id="nmNo">Cancel</button><button value="ok">Save</button></div></form></dialog>
<script>
'use strict';
/* ===== KADlite core: state, geometry, entity kinds (KAD's own object schema) ===== */
const $=s=>document.querySelector(s),cv=$('#cv'),cx=cv.getContext('2d');
const TAU=Math.PI*2,D2R=Math.PI/180,R6=v=>Math.round(v*1e6)/1e6,num=v=>typeof v=='number'&&isFinite(v),clone=o=>JSON.parse(JSON.stringify(o));
const nrm=a=>((a%TAU)+TAU)%TAU,mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2],hyp=(a,b)=>Math.hypot(b[0]-a[0],b[1]-a[1]);
let E=[],nid=1,U=[],uSize=0,Rd=[],sel=new Set(),tool='select',pts=[],mp=[0,0],sp=null,V={s:4,x:60,y:400},W=1,H=1,dpr=1,drag=null,shift=false,space=false,q=0,started=false,UN='mm',DL=null,BASE=null,pk=null,clip=[],bx=null,aim=0,nav=false,gest=null,GR=null,psT=0,dname='drawing',BB=new WeakMap();
const opt={grid:true,obj:true,ortho:false};
/* KAD's stock layers */
const LD=[['SOLID','#00d4ff','continuous',2],['HIDDEN','#ff4444','dashed',1],['CENTER','#ffdd00','center',1.2],['LEADER','#39ff14','continuous',1],['DIM','#39ff14','continuous',.5],['Layer_0','#00d4ff','continuous',1.7]];
const PAL=['#ff8a3d','#b266ff','#ff4fa3','#3dd6a0','#ffd23d','#4d9dff','#9ad14b','#ff6b6b'];
let LAYERS={},active='SOLID',carry={};
function defLayers(){LAYERS={};for(const[n,c,l,w]of LD)LAYERS[n]={name:n,color:c,ltype:l,weight:w,visible:true,locked:false};active='SOLID'}
defLayers();
const lay=o=>LAYERS[o.layer]||LAYERS.Layer_0||{visible:true,locked:false,color:'#00d4ff',ltype:'continuous',weight:1.7};
const vis=o=>lay(o).visible!==false,ed=o=>vis(o)&&!lay(o).locked;

/* view + units. Geometry is always stored in mm; UN only changes what you type and read. */
const w2s=p=>[V.x+p[0]*V.s,V.y-p[1]*V.s],s2w=p=>[(p[0]-V.x)/V.s,(V.y-p[1])/V.s];
const UF=()=>UN=='in'?25.4:1,fv=v=>(v/UF()).toFixed(UN=='in'?3:2);
const gstep=()=>{const r=28/V.s/UF(),p=10**Math.floor(Math.log10(r)),m=r/p;return UF()*p*(m<=1?1:m<=2?2:m<=5?5:10)};

/* ---- primitives: every entity reduces to line segments and ccw arcs ---- */
const L=(a,b)=>({t:'l',a,b}),A=(c,r,a0,a1)=>({t:'a',c,r,a0:nrm(a0),sw:nrm(a1-a0)||TAU});
const apt=(p,a)=>[p.c[0]+p.r*Math.cos(a),p.c[1]+p.r*Math.sin(a)];
const full=p=>p.sw>=TAU-1e-9,inA=(p,a)=>full(p)||nrm(a-p.a0)<=p.sw+1e-9;
const pEnds=p=>p.t=='l'?[p.a,p.b]:full(p)?[]:[apt(p,p.a0),apt(p,p.a0+p.sw)];
function segD(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;let t=l?((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy)}
function pDist(p,w){if(p.t=='l')return segD(w,p.a,p.b);const d=Math.hypot(w[0]-p.c[0],w[1]-p.c[1]);if(inA(p,Math.atan2(w[1]-p.c[1],w[0]-p.c[0])))return Math.abs(d-p.r);return Math.min(...pEnds(p).map(e=>hyp(w,e)))}
/* bulge arcs inside polylines (DXF's way of carrying an arc in a vertex list) */
function bulge(a,b,bu){const dx=b[0]-a[0],dy=b[1]-a[1],ch=Math.hypot(dx,dy);if(ch<1e-12)return null;const hf=2*Math.atan(bu),sn=Math.sin(hf);if(Math.abs(sn)<1e-12)return null;const r=Math.abs(ch/(2*sn)),h=(ch/2)/Math.tan(hf),c=[(a[0]+b[0])/2-dy/ch*h,(a[1]+b[1])/2+dx/ch*h];return{c,r,a1:Math.atan2(a[1]-c[1],a[0]-c[0]),a2:Math.atan2(b[1]-c[1],b[0]-c[0]),ccw:bu>0}}
const bPrim=g=>g.ccw?A(g.c,g.r,g.a1,g.a2):A(g.c,g.r,g.a2,g.a1);
function pSegs(o){const P=o.pts,n=P.length,m=o.closed?n:n-1,out=[];for(let i=0;i<m;i++){const p=P[i],r=P[(i+1)%n],a=[p.x,p.y],b=[r.x,r.y];out.push({a,b,bu:p.b||0,g:p.b?bulge(a,b,p.b):null})}return out}
/* KAD's dimension look: fixed offset, extension lines, arrows, text */
const DIM_OFF=8,DIM_GAP=3,DIM_EXT=5,DIM_ARR=3,DIM_TXT=3.5;
const dimLabel=o=>o.label||(UN=='in'?(hyp([o.x1,o.y1],[o.x2,o.y2])/25.4).toFixed(3)+'"':hyp([o.x1,o.y1],[o.x2,o.y2]).toFixed(2)+' mm');
function dimg(o){const dx=o.x2-o.x1,dy=o.y2-o.y1,ang=Math.atan2(dy,dx),pr=ang+Math.PI/2,cs=Math.cos(pr),sn=Math.sin(pr),d1=[o.x1+cs*DIM_OFF,o.y1+sn*DIM_OFF],d2=[o.x2+cs*DIM_OFF,o.y2+sn*DIM_OFF];let ta=ang;if(ta>Math.PI/2||ta<-Math.PI/2)ta+=Math.PI;
 return{ang,pr,ta,d1,d2,e1a:[o.x1+cs*DIM_GAP,o.y1+sn*DIM_GAP],e1b:[d1[0]+cs*DIM_EXT,d1[1]+sn*DIM_EXT],e2a:[o.x2+cs*DIM_GAP,o.y2+sn*DIM_GAP],e2b:[d2[0]+cs*DIM_EXT,d2[1]+sn*DIM_EXT],mid:mid(d1,d2)}}
/* text box (local frame, then rotated) */
const tw=o=>String(o.text).length*o.height*.6,tx0=o=>o.halign==1?-tw(o)/2:o.halign==2?-tw(o):0;
function tbox(o){const r=(o.rotation||0)*D2R,c=Math.cos(r),s=Math.sin(r),x0=tx0(o),w=tw(o),h=o.height;return[[x0,0],[x0+w,0],[x0+w,h],[x0,h]].map(p=>[o.x+p[0]*c-p[1]*s,o.y+p[0]*s+p[1]*c])}
function bez(b,t){const u=1-t;return[u*u*u*b.x0+3*u*u*t*b.cx1+3*u*t*t*b.cx2+t*t*t*b.x3,u*u*u*b.y0+3*u*u*t*b.cy1+3*u*t*t*b.cy2+t*t*t*b.y3]}
const SEGS=(P,z)=>{const r=[];for(let i=0;i<P.length-(z?0:1);i++)r.push(L(P[i],P[(i+1)%P.length]));return r};
const okP=p=>p&&num(p.x)&&num(p.y);
const mv2=(P,x,y)=>{P[0]=x;P[1]=y};

/* ---- entity kinds. type names and fields are KAD's: LINE CIRCLE ARC POLYLINE TEXT DIM POINT BEZIER HATCH ----
   ok=validate  prims=geometry  xf=fields after a transform  grips=[point,setter]  info=readout
   BEZIER, HATCH and POINT are carried and drawn so a KAD file survives a round trip; KADlite has no tool to create them. */
const K={
LINE:{ok:o=>[o.x1,o.y1,o.x2,o.y2].every(num),prims:o=>[L([o.x1,o.y1],[o.x2,o.y2])],
 xf:(o,T,P)=>{const a=P([o.x1,o.y1]),b=P([o.x2,o.y2]);return{x1:a[0],y1:a[1],x2:b[0],y2:b[1]}},
 grips:o=>[[[o.x1,o.y1],p=>{o.x1=p[0];o.y1=p[1]}],[[o.x2,o.y2],p=>{o.x2=p[0];o.y2=p[1]}]],
 info:o=>`Line   Length ${fv(Math.hypot(o.x2-o.x1,o.y2-o.y1))}   Angle ${(nrm(Math.atan2(o.y2-o.y1,o.x2-o.x1))/D2R).toFixed(1)}°`},
CIRCLE:{ok:o=>[o.cx,o.cy,o.r].every(num)&&o.r>0,prims:o=>[A([o.cx,o.cy],o.r,0,TAU)],
 xf:(o,T,P)=>{const c=P([o.cx,o.cy]);return{cx:c[0],cy:c[1],r:R6(o.r*T.k)}},
 grips:o=>[[[o.cx,o.cy],p=>{o.cx=p[0];o.cy=p[1]}],[[o.cx+o.r,o.cy],p=>{const r=hyp([o.cx,o.cy],p);if(r>0)o.r=R6(r)}]],
 info:o=>`Circle   R ${fv(o.r)}   Ø ${fv(o.r*2)}`},
ARC:{ok:o=>[o.cx,o.cy,o.r,o.startA,o.endA].every(num)&&o.r>0,prims:o=>[o.ccw?A([o.cx,o.cy],o.r,o.startA,o.endA):A([o.cx,o.cy],o.r,o.endA,o.startA)],
 xf:(o,T,P)=>{const c=P([o.cx,o.cy]);return{cx:c[0],cy:c[1],r:R6(o.r*T.k),startA:T.ang(o.startA),endA:T.ang(o.endA),ccw:T.flip?!o.ccw:!!o.ccw}},
 grips:o=>{const p=K.ARC.prims(o)[0],e=ae=>[o.cx+o.r*Math.cos(ae),o.cy+o.r*Math.sin(ae)],an=pt=>Math.atan2(pt[1]-o.cy,pt[0]-o.cx);return[[e(o.startA),pt=>o.startA=an(pt)],[e(o.endA),pt=>o.endA=an(pt)]]},
 info:o=>`Arc   R ${fv(o.r)}   Sweep ${(K.ARC.prims(o)[0].sw/D2R).toFixed(1)}°`},
POLYLINE:{ok:o=>Array.isArray(o.pts)&&o.pts.length>1&&o.pts.every(okP),prims:o=>pSegs(o).map(s=>s.g?bPrim(s.g):L(s.a,s.b)),
 xf:(o,T,P)=>({pts:o.pts.map(p=>{const r=P([p.x,p.y]),n={x:r[0],y:r[1]};if(p.b)n.b=T.flip?-p.b:p.b;return n}),closed:!!o.closed}),
 grips:o=>o.pts.map(p=>[[p.x,p.y],r=>{p.x=r[0];p.y=r[1]}]),
 info:o=>`${o.closed?'Closed polyline':'Polyline'}   ${o.pts.length} points   Length ${fv(K.POLYLINE.prims(o).reduce((s,p)=>s+(p.t=='l'?hyp(p.a,p.b):p.r*p.sw),0))}`},

  for(const e of E){const l=e.layer;
    if(e.type=='LINE'){ent('LINE',l,'AcDbLine');P('10',f(e.x1),'20',f(e.y1),'30','0.0000','11',f(e.x2),'21',f(e.y2),'31','0.0000')}
    else if(e.type=='POINT'){ent('POINT',l,'AcDbPoint');P('10',f(e.x),'20',f(e.y),'30','0.0000')}
    else if(e.type=='CIRCLE'){ent('CIRCLE',l,'AcDbCircle');P('10',f(e.cx),'20',f(e.cy),'30','0.0000','40',f(e.r))}
    else if(e.type=='ARC'){
      if(Math.abs(e.endA-e.startA)>=TAU-1e-9){ent('CIRCLE',l,'AcDbCircle');P('10',f(e.cx),'20',f(e.cy),'30','0.0000','40',f(e.r))}
      else{const dg=a=>(nrm(a)/D2R).toFixed(6);ent('ARC',l,'AcDbCircle');P('10',f(e.cx),'20',f(e.cy),'30','0.0000','40',f(e.r),'100','AcDbArc','50',dg(e.ccw?e.startA:e.endA),'51',dg(e.ccw?e.endA:e.startA))}}
    else if(e.type=='POLYLINE')lw(e,e.pts,e.closed);
    else if(e.type=='HATCH')for(const lp of e.loops)lw(e,lp,true);
    else if(e.type=='BEZIER'){for(const b of e.beziers){ent('SPLINE',l,'AcDbSpline');P('210','0.0','220','0.0','230','1.0','70','8','71','3','72','8','73','4','74','0');for(const k of[0,0,0,0,1,1,1,1])P('40',k.toFixed(1));for(const[px,py]of[[b.x0,b.y0],[b.cx1,b.cy1],[b.cx2,b.cy2],[b.x3,b.y3]])P('10',f(px),'20',f(py),'30','0.0000')}
      if(e.closed){const a=e.beziers[0],z=e.beziers[e.beziers.length-1];if(Math.hypot(z.x3-a.x0,z.y3-a.y0)>1e-6){ent('LINE',l,'AcDbLine');P('10',f(z.x3),'20',f(z.y3),'30','0.0000','11',f(a.x0),'21',f(a.y0),'31','0.0000')}}}
    else if(e.type=='DIM'){const g=dimg(e);ent('DIMENSION',l,'AcDbDimension');P('2',dn.get(e),'10',f(g.d1[0]),'20',f(g.d1[1]),'30','0.0','11',f(g.mid[0]),'21',f(g.mid[1]),'31','0.0','70','33','1',dimLabel(e),'3','KAD','100','AcDbAlignedDimension','13',f(e.x1),'23',f(e.y1),'33','0.0','14',f(e.x2),'24',f(e.y2),'34','0.0')}
    else if(e.type=='TEXT'){ent('TEXT',l,'AcDbText');P('10',f(e.x),'20',f(e.y),'30','0.0000','40',f(e.height||5),'1',String(e.text),'50',(e.rotation||0).toFixed(6),'7','KAD');if(e.halign)P('72',String(e.halign),'11',f(e.x),'21',f(e.y),'31','0.0000');P('100','AcDbText')}}
  const rootH=H(),grpH=H();
  P('0','ENDSEC','0','SECTION','2','OBJECTS','0','DICTIONARY','5',rootH,'330','0','100','AcDbDictionary','3','ACAD_GROUP','350',grpH,'0','DICTIONARY','5',grpH,'330',rootH,'100','AcDbDictionary','0','ENDSEC','0','EOF');
  o[seedAt]=(h+1).toString(16).toUpperCase();return o.join('\n')}

/* ===== saving ===== */
async function dl(name,data){
  if(!DL){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/octet-stream'}));a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1e4);say('Saved '+name);return}
  try{await DL.save({filename:name,data});say('Saved '+name)}
  catch(e){if(e&&e.code=='rejected_extension')say('This viewer can only save certain file types.');else if(!e||e.code!='declined')say('Could not save: '+((e&&e.message)||'unavailable'))}}
const askName=()=>new Promise(r=>{const d=$('#nmDlg'),i=$('#nmIn');i.value=dname;d.returnValue='';d.onclose=()=>r(d.returnValue=='ok'?i.value:null);d.showModal();i.select()});
$('#nmNo').onclick=()=>$('#nmDlg').close();
const safeName=n=>n.replace(/\.(kad|dxf)$/i,'').replace(/[\\\/:*?"<>|]+/g,'').trim()||'drawing';
on('#bSave',async()=>{const n=await askName();if(n===null)return;dname=safeName(n);dl(dname+'.kad',JSON.stringify(toFile(),null,1))});
on('#bDxf',()=>{if(!E.length)say('Draw something first.');else dl(dname+'.dxf',buildDXF())});
$('#file').onchange=async e=>{
  const fl=e.target.files[0];e.target.value='';if(!fl)return;
  try{
    const txt=await fl.text(),isDxf=/\.dxf$/i.test(fl.name),r=isDxf?parseDXF(txt):fromFile(JSON.parse(txt));
    if(!r.objs.length)return say(isDxf?'That DXF has no drawable entities.':'No drawing found in that file.');
    applyDoc(r,safeName(fl.name));say('Opened '+fl.name+' · '+r.objs.length.toLocaleString()+' objects'+(r.notes&&r.notes.length?' · '+r.notes.join(' · '):''))}
  catch(err){say(/DXF|ENTITIES/.test(err.message)?err.message:'That file is not a valid KAD or DXF drawing.')}};
(function dlInit(n=0){
  if(window.claude&&window.claude.use)window.claude.use('downloads').then(d=>{DL=d;if(d){$('#bSave').classList.remove('hide');$('#bDxf').classList.remove('hide')}}).catch(()=>{});
  else if(n<8)setTimeout(()=>dlInit(n+1),250);else{$('#bSave').classList.remove('hide');$('#bDxf').classList.remove('hide')}})();

/* ===== start ===== */
function sample(){
  const b=.41421356,P=[[12,0],[108,0,b],[120,12],[120,58,b],[108,70],[12,70,b],[0,58],[0,12,b]].map(p=>({x:p[0],y:p[1],...(p[2]?{b:p[2]}:{})}));
  put({type:'POLYLINE',closed:true,pts:P},'SOLID');
  for(const[x,y]of[[16,16],[104,16],[104,54],[16,54]])put(mk.circ([x,y],4),'SOLID');
  put(mk.circ([60,35],12),'SOLID');put(mk.line([36,35],[84,35]),'CENTER');put(mk.line([60,11],[60,59]),'CENTER');
  put({...mk.line([120,0],[0,0]),type:'DIM'},'DIM');put({...mk.line([0,0],[0,70]),type:'DIM'},'DIM');
  put(mk.text([0,-26],'SAMPLE PLATE  ·  MENU > NEW DRAWING CLEARS IT',3.5),'LEADER')}
let loaded=false;
try{const raw=localStorage.getItem('kadlite');if(raw){const r=fromFile(JSON.parse(raw));E=r.objs;LAYERS=r.ly;active=r.active;UN=r.un;nid=r.nid;carry=r.carry;loaded=true}}catch{}
if(!loaded)sample();
new ResizeObserver(()=>{const r=$('#wrap').getBoundingClientRect();dpr=window.devicePixelRatio||1;W=r.width;H=r.height;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);if(!started){started=true;fit()}redraw()}).observe($('#wrap'));
if(window.visualViewport){const vf=()=>{document.body.style.height=visualViewport.height+'px';scrollTo(0,0);redraw()};visualViewport.addEventListener('resize',vf);vf()}
ui();
